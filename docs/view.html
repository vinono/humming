<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>humming Docs | Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../site/styles.css" />
    <link rel="stylesheet" href="../site/vendor/prism-tomorrow.min.css" />
    <!-- Markdown Parser & Prism Syntax Highlighting Engine -->
    <script src="../site/vendor/marked.min.js"></script>
    <script src="../site/vendor/prism.min.js"></script>
    <script src="../site/vendor/prism-javascript.min.js"></script>
    <script src="../site/vendor/prism-typescript.min.js"></script>
    <script src="../site/vendor/prism-bash.min.js"></script>
    <script src="../site/vendor/prism-json.min.js"></script>
    <script src="../site/vendor/prism-yaml.min.js"></script>
    <script defer src="../site/i18n.js"></script>
    <script defer src="../site/soundscape.js"></script>
    <script defer src="../site/docs-viewer.js"></script>
  </head>
  <body class="page-shell docs-reader-shell" data-page="docs">
    <!-- Ambient Backdrop -->
    <div class="site-backdrop" aria-hidden="true">
      <canvas id="soundscape-canvas"></canvas>
      <div class="ambient-aura aura-1"></div>
      <div class="ambient-aura aura-2"></div>
      <div class="subtle-noise"></div>
    </div>

    <!-- Floating Top Navigation -->
    <div class="topbar-wrapper">
      <header class="topbar">
        <a class="brand-lockup" href="../index.html" aria-label="humming home" data-i18n-aria="brand.homeAria">
          <img
            class="brand-logo-img"
            src="../assets/brand/humming-mark.svg"
            alt="humming"
            width="32"
            height="32"
          />
          <span data-i18n="brand.docs">humming docs</span>
        </a>

        <nav class="topnav" aria-label="Main Navigation">
          <a class="nav-link" href="../index.html" data-i18n="nav.home">Home</a>
          <a class="nav-link" href="./index.html" data-i18n="nav.docsPortal">Docs Portal</a>
          <a class="nav-link" href="../README.md" target="_blank" rel="noopener noreferrer" data-i18n="nav.readme">README</a>
        </nav>

        <div class="topbar-actions">
          <!-- Language Switcher -->
          <div class="lang-switch" role="group" aria-label="Language switch" data-i18n-aria="lang.switchLabel">
            <button type="button" class="lang-btn active" data-lang-switch="en">EN</button>
            <button type="button" class="lang-btn" data-lang-switch="zh">中文</button>
          </div>

          <a class="btn-topbar-cta" href="./index.html" data-i18n="nav.portalBtn" style="background:rgba(255,255,255,0.06); color:var(--text-primary); border:1px solid var(--border-subtle);">
            ← Portal
          </a>
          <a class="btn-topbar-cta" href="https://github.com/vinono/humming" target="_blank" rel="noopener noreferrer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right:2px;">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            <span>GitHub</span>
          </a>
        </div>
      </header>
    </div>

    <!-- 3-Column Docs Reader Shell -->
    <div class="docs-reader-container">
      <!-- 1. Left Sidebar Navigation -->
      <aside class="docs-sidebar">
        <div class="docs-search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="search"
            id="docs-search-input"
            placeholder="Filter documentation..."
            aria-label="Filter documentation"
          />
        </div>

        <nav id="docs-sidebar-nav" class="docs-nav-groups" aria-label="Documentation Sidebar"></nav>
      </aside>

      <!-- 2. Main Markdown Content -->
      <main class="docs-article-pane">
        <div class="docs-article-header">
          <div class="docs-breadcrumbs">
            <a href="./index.html">Docs</a>
            <span>›</span>
            <span id="doc-breadcrumb-title">Document</span>
          </div>
        </div>

        <!-- Rendered Markdown Body -->
        <article class="markdown-prose" id="doc-markdown-body">
          <div class="docs-loading-state">
            <span class="status-dot"></span>
            <span>Loading document...</span>
          </div>
        </article>

        <!-- Previous & Next Article Pager -->
        <nav id="doc-pager" class="docs-pager-wrapper" aria-label="Document Pager"></nav>
      </main>

      <!-- 3. Right Sidebar TOC -->
      <aside class="docs-toc-sidebar">
        <div class="toc-sticky-box">
          <div class="toc-header">
            <span>ON THIS PAGE</span>
          </div>
          <ul id="doc-toc-list" class="toc-list"></ul>

          <div class="toc-footer-actions">
            <a id="doc-edit-github-link" href="#" target="_blank" rel="noopener noreferrer" class="toc-action-link">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              <span>Edit on GitHub</span>
            </a>
          </div>
        </div>
      </aside>
    </div>
  </body>
</html>
